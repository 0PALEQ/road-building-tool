pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom-remap') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = "RoadBuilder"

['fabric-1.20.1', 'fabric-1.21.1', 'fabric-1.21.11'].each { target ->
    include(target)
    project(":${target}").projectDir = file("versions/${target}")
}
